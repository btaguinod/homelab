# TODO: check if there's a way make sure this playbook isn't run without setup
- name: Homepage install
  hosts: swarm_manager
  become: true
  tasks: 
    - name: Create Homepage directory
      ansible.builtin.file:
        path: /etc/homepage
        state: directory

    - name: Copy homepage configuration
      ansible.builtin.copy:
        src: config/
        dest: /etc/homepage/
      register: homepage_config


    - name: Start Homepage container
      community.docker.docker_swarm_service:
        name: homepage
        image: ghcr.io/gethomepage/homepage:v2.4.0
        mounts:
          - type: bind
            source: /etc/homepage
            target: /app/config
        networks:
          - swarm-network
        force_update: "{{ homepage_config.changed }}"
        env:
          HOMEPAGE_ALLOWED_HOSTS: homepage.new.benedict-lab.com
        labels:
          traefik.enable: "true"          
          traefik.http.routers.homepage-router.rule: "Host(`homepage.new.benedict-lab.com`)"          
          traefik.http.routers.homepage-router.entrypoints: "websecure"          
          traefik.http.services.homepage-backend.loadbalancer.server.port: "3000"
          traefik.http.routers.homepage-router.tls.certresolver: "letsencrypt"
          traefik.http.routers.homepage-router.tls: "true"