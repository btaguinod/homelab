api:
  # TODO: disable insecure dashboard
  insecure: true
  disableDashboardAd: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections: # Global HTTP -> HTTPS redirect
        entryPoint:
          to: "websecure"
          scheme: "https"
  websecure:
    address: ":443"

certificatesResolvers:
  letsencrypt:
    acme:
      storage: acme.json
      dnsChallenge:
        provider: namecheap

providers:
  docker:
    swarmMode: true
    exposedByDefault: false