- name: Server setup
  hosts: swarm
  become: true
  tasks:
    - name: Install Docker and Python SDK
      ansible.builtin.package:
        name:
          - docker.io
          - python3-docker
        state: present

    - name: Ensure Docker service is running and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

- name: Init swarm on manager
  hosts: swarm_manager
  become: true
  tasks: 
    - name: Init a new swarm with default parameters
      community.docker.docker_swarm:
        state: present
        advertise_addr: "{{ ansible_host }}"

    - name: Create overlay network
      community.docker.docker_network:
        name: swarm-network
        driver: overlay
        attachable: true
        state: present

- name: Join workers to swarm
  hosts: swarm_workers
  become: true
  tasks:
    - name: Get worker join token from manager
      community.docker.docker_swarm_info:
      register: swarm_info
      delegate_to: "{{ groups['swarm_manager'] | first }}"
      run_once: true

    - name: Join swarm as worker
      community.docker.docker_swarm:
        state: join
        advertise_addr: "{{ ansible_host }}"
        remote_addrs: "{{ hostvars['swarm-server-1'].ansible_host }}"
        join_token: "{{ swarm_info.swarm_facts.JoinTokens.Worker }}"